version: "3"
services:
  postgres:
    image: postgres:15
    container_name: consentlayer_db
    restart: always
    env_file:
      - ../packages/api/.env
    environment:
      # POSTGRES_USER: ${DB_USER}
      # POSTGRES_PASSWORD: ${DB_PASSWORD}
      # POSTGRES_DB: ${DB_NAME}
      - POSTGRES_USER=consentlayer
      - POSTGRES_PASSWORD=consentlayer_ps
      - POSTGRES_DB=consentlayer_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo:7
    container_name: consentlayerMongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    command: ["--replSet", "rs0"]
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  chroma:
    image: chromadb/chroma
    container_name: chroma-server
    command: run --path /chroma/.chroma/index
    ports:
      - "8000:8000"
    volumes:
      - ./chroma-data:/chroma/.chroma/index
    restart: unless-stopped

  scan-worker:
    build:
    environment:
      - KAFKA_URL  = kafka:9092
      - REDIS_URL = redis:6379
    depends_on:
      - kafka
      - redis
    deploy:
      replicas: 4

    kafka:
      imsge: bitnami/kafka:latest
      environment:
        - KAFKA_BROKER_ID=1
        - KAFKA_ZOOKEEPER_CONNECT=zookeper:2181
      ports:
        - 9092:9092
      depends_on:
        - zoookeeper
    zookeeper:
      image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
  mongodata: